responses:
  utter_greet:
    - text: "Привет! Я HR-бот. Проведу первичное интервью (примерно пять–семь минут). Задам вопросы по очереди: по одному за раз. Представьтесь, пожалуйста: укажите ваше ФИО."

  utter_ask_name:
    - text: "Представьтесь, пожалуйста: укажите ваше ФИО."

  utter_intro_after_readiness:
    - text: "Понятно. Тогда начнём с короткого блока про вас: представьтесь, пожалуйста (ФИО)."

  utter_confirm_name:
    - text: "Приятно познакомиться, {candidate_first_name}!"

  utter_name_acknowledged:
    - text: "Приятно познакомиться, {candidate_first_name}!"

  utter_experience_parse_error:
    - text: "Не смог распознать число лет опыта. Напишите, пожалуйста, цифрой, например: 2 или 0.5."

  utter_role_not_recognized:
    - text: "Не уверен, что понял роль. Выберите из списка или напишите: Data Scientist, Data Engineer, Data Analyst, Project Manager, MLOps Engineer."

  utter_role_confirmed:
    - text: "Отлично, записал позицию: {role}."

  utter_ask_experience:
    - text: "Сколько лет у вас опыта в IT или сфере данных?"

  utter_low_experience_warning:
    - text: "У нас открыты позиции, которые требуют опыта. Расскажите — были ли стажировки или учебные проекты?"

  utter_ask_role:
    - text: "Какая позиция вас интересует?"
      buttons:
        - title: "Data Scientist"
          payload: '/provide_desired_role{{"desired_role": "data_scientist"}}'
        - title: "Data Engineer"
          payload: '/provide_desired_role{{"desired_role": "data_engineer"}}'
        - title: "Data Analyst"
          payload: '/provide_desired_role{{"desired_role": "data_analyst"}}'
        - title: "Project Manager"
          payload: '/provide_desired_role{{"desired_role": "project_manager"}}'
        - title: "MLOps Engineer"
          payload: '/provide_desired_role{{"desired_role": "mlops_engineer"}}'

  utter_unknown_role_hint:
    - text: "Сейчас мы набираем на роли Data Scientist, Data Engineer, Data Analyst, Project Manager и MLOps Engineer. Если что-то из этого подходит — напишите, пожалуйста, какая позиция ближе."

  utter_confirm_receipt:
    - text: "Понятно, записал."
    - text: "Хорошо, двигаемся дальше."
    - text: "Принял."

  utter_transition_to_role_questions:
    - text: "Отлично, переходим к профессиональным вопросам."

  utter_ask_ds_ml_experience:
    - text: "Расскажите об опыте разработки ML-моделей."
  utter_ask_ds_python_level:
    - text: "Какой у вас уровень Python? (начальный / средний / продвинутый)"
  utter_ask_ds_frameworks:
    - text: "Какие ML-фреймворки использовали? Например, sklearn, PyTorch, TensorFlow, CatBoost."
  utter_ask_ds_production:
    - text: "Был ли опыт вывода ML-моделей в production?"
  utter_ask_ds_task_types:
    - text: "Какие типы ML-задач решали? (классификация, регрессия, NLP, CV и т.д.)"
  utter_ask_ds_feature_engineering:
    - text: "Работали ли с feature engineering? Приведите пример."
  utter_ask_ds_validation:
    - text: "Как валидировали модели? Какие метрики использовали?"
  utter_ask_ds_ab_testing:
    - text: "Есть ли опыт A/B тестирования?"
  utter_ask_ds_llm:
    - text: "Работали ли с LLM или генеративными моделями?"
  utter_ask_ds_inference_opt:
    - text: "Есть ли опыт оптимизации inference (latency, memory)?"

  utter_ask_de_pipeline:
    - text: "Опишите опыт с ETL/ELT пайплайнами."
  utter_ask_de_data_volumes:
    - text: "С какими объёмами данных работали? (GB/TB/PB)"
  utter_ask_de_batch_streaming:
    - text: "Работали ли с batch и/или streaming обработкой?"
  utter_ask_de_kafka_spark:
    - text: "Есть ли опыт Kafka или Spark?"
  utter_ask_de_warehouse:
    - text: "Работали ли с Data Warehouse (Snowflake, BigQuery, Redshift и т.д.)?"
  utter_ask_de_sql_optimization:
    - text: "Оптимизировали ли сложные SQL-запросы? Опыт оконных функций?"
  utter_ask_de_tools:
    - text: "Какие инструменты использовали? Например, Airflow, Spark, dbt, Kafka."
  utter_ask_de_cloud:
    - text: "Есть ли опыт с облачными платформами — AWS, GCP, Azure, Yandex Cloud?"
  utter_ask_de_sql:
    - text: "Как оцените свой уровень SQL?"
  utter_ask_de_orchestration:
    - text: "Какие оркестраторы использовали (Airflow, Prefect, Dagster)?"
  utter_ask_de_monitoring:
    - text: "Как обеспечивали мониторинг качества данных?"

  utter_ask_da_domain:
    - text: "В каких предметных областях работали аналитиком?"
  utter_ask_da_product_metrics:
    - text: "Строили ли продуктовые метрики? Какие?"
  utter_ask_da_ab_tests:
    - text: "Есть ли опыт A/B тестирования или статистических тестов?"
  utter_ask_da_funnel_cohort:
    - text: "Работали ли с funnel или cohort analysis?"
  utter_ask_da_viz:
    - text: "Какие инструменты визуализации используете? Например, Tableau, Power BI, Plotly."
  utter_ask_da_sql:
    - text: "Оцените свой уровень SQL: базовый, средний или продвинутый?"
  utter_ask_da_bi:
    - text: "Какие BI-инструменты используете? Строили ли дашборды для stakeholders?"
  utter_ask_da_stakeholders:
    - text: "Как взаимодействовали со стейкхолдерами? Переводили бизнес-задачу в аналитическую?"
  utter_ask_da_product_thinking:
    - text: "Приведите пример, когда аналитика помогла принять продуктовое решение."

  utter_ask_pm_team_size:
    - text: "Какой максимальный размер команды вы координировали?"
  utter_ask_pm_methodology:
    - text: "Какие методологии применяли? Scrum, Kanban, Waterfall или гибрид?"
  utter_ask_pm_ml_understanding:
    - text: "Как оцените своё понимание ML-проектов и их специфики?"
  utter_ask_pm_risk_management:
    - text: "Как управляли рисками на проектах?"
  utter_ask_pm_budget:
    - text: "Был ли у вас budget ownership? Каков был бюджет?"
  utter_ask_pm_conflict:
    - text: "Приведите пример разрешения конфликта в команде."
  utter_ask_pm_delivery:
    - text: "Расскажите о проекте, за delivery которого вы несли полную ответственность."
  utter_ask_pm_distributed_team:
    - text: "Работали ли с распределёнными или кросс-функциональными командами?"
  utter_ask_pm_ai_ml_projects:
    - text: "Есть ли опыт управления AI/ML проектами?"

  utter_ask_mlops_cicd:
    - text: "Есть ли опыт CI/CD для ML-проектов?"
  utter_ask_mlops_tools:
    - text: "Какие MLOps-инструменты знаете? Например, MLflow, Kubeflow, Docker, Kubernetes."
  utter_ask_mlops_monitoring:
    - text: "Есть ли опыт мониторинга моделей — дрейф данных, метрики качества?"
  utter_ask_mlops_kubernetes:
    - text: "Есть ли опыт работы с Kubernetes?"
  utter_ask_mlops_model_registry:
    - text: "Работали ли с model registry (MLflow, DVC, Neptune)?"
  utter_ask_mlops_docker:
    - text: "Используете ли Docker в ML-пайплайнах?"
  utter_ask_mlops_iac:
    - text: "Есть ли опыт IaC (Terraform, Pulumi)?"
  utter_ask_mlops_serving:
    - text: "Как организовывали ML serving (Triton, TorchServe, BentoML и т.д.)?"
  utter_ask_mlops_gpu:
    - text: "Есть ли опыт работы с GPU-инфраструктурой?"

  utter_ask_salary:
    - text: "Какой уровень вознаграждения вас интересует (₽/мес, до вычета налогов)?"
  utter_salary_format_hint:
    - text: "Укажите сумму цифрами, например: 150000."

  utter_farewell_suitable:
    - text: "Спасибо, {candidate_first_name}. На основе нашего разговора ваш профиль соответствует позиции {desired_role}. Наш специалист свяжется с вами в течение двух рабочих дней."

  utter_farewell_not_suitable:
    - text: "Спасибо за участие, {candidate_first_name}. К сожалению, на данный момент ваш профиль не совпадает с нашими открытыми позициями. Мы сохраним данные и свяжемся при появлении подходящей вакансии."

  utter_farewell_stopped:
    - text: "Понятно. Если захотите продолжить позже — просто напишите снова. Спасибо за ваше время."

  utter_ask_repeat_rephrase:
    - text: "Повторяю вопрос: {last_question}. Например, можно ответить так: {example}."

  utter_out_of_scope:
    - text: "Это вне моей зоны. Вернёмся к интервью: {last_question}"

  utter_clarify_options:
    - text: "Уточните, пожалуйста: начальный, средний или продвинутый?"

  utter_not_recognized:
    - text: "Кажется, я не распознал ответ. Попробуйте сформулировать иначе."

  utter_unclear_move_on:
    - text: "Понятно. Зафиксирую как есть и перейду к следующему вопросу."

  utter_goodbye:
    - text: "До свидания! Было приятно пообщаться."

  utter_unsuitable_ack:
    - text: "Сейчас я не принимаю решений по отбору: сначала соберу ответы. Если захотите продолжить — ответьте на текущий вопрос."

actions:
  - action_greet
  - action_collect_name
  - action_stop_interview
