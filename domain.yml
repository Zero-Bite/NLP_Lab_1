  mlops_ci_cd:
    type: bool
    mappings:
      - type: custom
  mlops_tools:
    type: list
    mappings:
      - type: custom
  mlops_monitoring:
    type: bool
    mappings:
      - type: custom
  mlops_kubernetes:
    type: text
    mappings:
      - type: custom
