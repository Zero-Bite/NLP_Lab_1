    type: text
    mappings:
      - type: custom
  mlops_docker:
    type: text
    mappings:
      - type: custom
  mlops_iac:
    type: text
    mappings:
      - type: custom
  mlops_serving:
    type: text
    mappings:
      - type: custom
  mlops_gpu:
    type: text
    mappings:
