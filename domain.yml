version: "3.1"

intents:
  - greet
  - goodbye
  - affirm
  - deny
  - stop_interview
  - ask_repeat
  - out_of_scope
  - fallback
  - confirm_readiness
  - provide_name
  - provide_experience
  - provide_desired_role
  - provide_salary
  - provide_skills
  - provide_project_experience
  - answer_interview_open
  - answer_skill_python
  - answer_ml_experience
  - answer_frameworks
  - answer_production_experience
  - answer_pipeline_experience
  - answer_tools
  - answer_cloud_experience
  - answer_sql_level
  - answer_viz_tools
  - answer_business_domain
  - answer_team_size
  - answer_methodology
  - answer_ml_understanding
  - answer_cicd_experience
  - answer_monitoring_experience
  - no_experience
  - unsuitable
  # nlu_fallback — системный интент Rasa, не объявляется в domain

entities:
  - candidate_name
  - experience_years
  - desired_role
  - salary_expectation
  - pm_team_size

slots:
  candidate_name:
    type: text
    mappings:
      - type: from_entity
        entity: candidate_name

  candidate_first_name:
    type: text
    mappings:
      - type: custom

  experience_years:
    type: float
    mappings:
      - type: from_entity
        entity: experience_years

  desired_role:
    type: categorical
    values:
      - data_scientist
      - data_engineer
      - data_analyst
      - project_manager
      - mlops_engineer
    mappings:
      - type: from_entity
        entity: desired_role

  salary_expectation:
    type: float
    mappings:
      - type: from_entity
        entity: salary_expectation

  interview_stage:
    type: categorical
    values:
      - idle
      - greeting
      - collect_name
      - collect_experience
      - collect_experience_low
      - collect_role
      - interview_ds
      - interview_de
      - interview_da
      - interview_pm
      - interview_mlops
      - not_suitable
      - collect_salary
      - assessment
      - farewell
      - end
    mappings:
      - type: custom

  last_question_key:
    type: text
    mappings:
      - type: custom

  ask_repeat_count:
    type: float
    mappings:
      - type: custom

  clarify_count:
    type: float
    mappings:
      - type: custom

  salary_parse_attempts:
    type: float
    mappings:
      - type: custom


  ds_python_risk:
    type: bool
    mappings:
      - type: custom

  is_suitable:
    type: bool
    mappings:
      - type: custom

  unsuitable_reason:
    type: text
    mappings:
      - type: custom

  candidate_score:
    type: float
    mappings:
      - type: custom
  candidate_level:
    type: text
    mappings:
      - type: custom
  hire_decision:
    type: text
    mappings:
      - type: custom
  candidate_strengths:
    type: list
    mappings:
      - type: custom
  candidate_weaknesses:
    type: list
    mappings:
      - type: custom
  consistency_warnings:
    type: list
    mappings:
      - type: custom

  out_of_scope_count:
    type: float
    initial_value: 0
    mappings:
      - type: custom

  ds_ml_experience:
    type: text
    mappings:
      - type: custom
  ds_python_level:
    type: categorical
    values:
      - beginner
      - intermediate
      - advanced
    mappings:
      - type: custom
  ds_frameworks:
    type: list
    mappings:
      - type: custom
  ds_has_production:
    type: bool
    mappings:
      - type: custom
  ds_task_types:
    type: text
    mappings:
      - type: custom
  ds_feature_engineering:
    type: text
    mappings:
      - type: custom
  ds_validation:
    type: text
    mappings:
      - type: custom
  ds_ab_testing:
    type: text
    mappings:
      - type: custom
  ds_llm_experience:
    type: text
    mappings:
      - type: custom
  ds_inference_opt:
    type: text
    mappings:
      - type: custom

  de_pipeline_experience:
    type: text
    mappings:
      - type: custom
  de_tools:
    type: list
    mappings:
      - type: custom
  de_cloud_experience:
    type: bool
    mappings:
      - type: custom
  de_sql_level:
    type: categorical
    values:
      - beginner
      - intermediate
      - advanced
    mappings:
      - type: custom
  de_sql_optimization:
    type: text
    mappings:
      - type: custom
  de_data_volumes:
    type: text
    mappings:
      - type: custom
  de_batch_streaming:
    type: text
    mappings:
      - type: custom
  de_kafka_spark:
    type: text
    mappings:
      - type: custom
  de_warehouse:
    type: text
    mappings:
      - type: custom
  de_orchestration:
    type: text
    mappings:
      - type: custom
  de_monitoring:
    type: text
    mappings:
      - type: custom

  da_viz_tools:
    type: list
    mappings:
      - type: custom
  da_sql_level:
    type: categorical
    values:
      - beginner
      - intermediate
      - advanced
    mappings:
      - type: custom
  da_business_domain:
    type: text
    mappings:
      - type: custom
  da_product_metrics:
    type: text
    mappings:
      - type: custom
  da_ab_tests:
    type: text
    mappings:
      - type: custom
  da_funnel_cohort:
    type: text
    mappings:
      - type: custom
  da_bi_dashboards:
    type: text
    mappings:
      - type: custom
  da_stakeholders:
    type: text
    mappings:
      - type: custom
  da_product_thinking:
    type: text
    mappings:
      - type: custom

  pm_team_size:
    type: float
    mappings:
      - type: from_entity
        entity: pm_team_size
  pm_methodology:
    type: list
    mappings:
      - type: custom
  pm_ml_understanding:
    type: categorical
    values:
      - none
      - basic
      - good
    mappings:
      - type: custom
  pm_risk_management:
    type: text
    mappings:
