version: "3.1"

stories:
  - story: greet and confirm readiness
    steps:
      - intent: greet
      - action: action_greet
      - intent: confirm_readiness
      - action: action_confirm_readiness

  - story: greet then provide name
    steps:
      - intent: greet
      - action: action_greet
      - intent: provide_name
      - action: utter_confirm_name
      - action: action_say_utter_ask_experience

  - story: low experience warning and continue
    steps:
      - intent: greet
      - action: action_greet
      - intent: provide_name
      - action: utter_confirm_name
      - action: action_say_utter_ask_experience
      - intent: provide_experience
        entities:
          - experience_years: 0.3
      - action: utter_confirm_receipt
      - action: action_say_utter_low_experience_warning
      - action: action_say_utter_ask_role

  - story: low experience affirm then choose role
    steps:
      - intent: greet
      - action: action_greet
      - intent: provide_name
      - action: utter_confirm_name
      - action: action_say_utter_ask_experience
      - intent: provide_experience
        entities:
          - experience_years: 0.5
      - action: utter_confirm_receipt
      - action: action_say_utter_low_experience_warning
      - intent: affirm
      - action: utter_confirm_receipt
      - action: action_say_utter_ask_role

  - story: ask repeat then continue
    steps:
      - intent: greet
      - action: action_greet
      - intent: provide_name
      - action: utter_confirm_name
      - action: action_say_utter_ask_experience
      - intent: ask_repeat
      - action: action_ask_repeat
      - intent: provide_experience
      - action: utter_confirm_receipt

  - story: out of scope recovery
    steps:
      - intent: greet
      - action: action_greet
      - intent: provide_name
      - action: utter_confirm_name
      - action: action_say_utter_ask_experience
      - intent: out_of_scope
