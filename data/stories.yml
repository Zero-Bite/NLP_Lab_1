version: "3.1"

stories:

  # ─── Greeting / onboarding ────────────────────────────────────────────────

  - story: user greets and provides name immediately
    steps:
      - intent: greet
      - action: action_greet
      - intent: provide_name
      - action: action_collect_name

  - story: user greets and confirms readiness first
    steps:
      - intent: greet
      - action: action_greet
      - intent: confirm_readiness
      - action: action_confirm_readiness
      - intent: provide_name
      - action: action_collect_name

  # ─── Experience collection ────────────────────────────────────────────────

  - story: normal experience leads to role question
    steps:
      - intent: provide_experience
      - action: utter_confirm_receipt
      - action: action_say_utter_ask_role

  - story: low experience - warning then continue
    steps:
      - intent: provide_experience
        entities:
          - experience_years: 0.3
      - action: utter_confirm_receipt
      - action: action_say_utter_low_experience_warning
      - intent: affirm
      - action: utter_confirm_receipt
      - action: action_say_utter_ask_role

  - story: low experience - candidate answers with open text
    steps:
      - intent: provide_experience
        entities:
          - experience_years: 0.5
      - action: utter_confirm_receipt
      - action: action_say_utter_low_experience_warning
      - intent: answer_interview_open
      - action: utter_confirm_receipt
      - action: action_say_utter_ask_role

  # ─── Experience → role selection (full chain teaches TED to wait) ─────────

  - story: experience then select data scientist
    steps:
      - intent: provide_experience
      - action: utter_confirm_receipt
      - action: action_say_utter_ask_role
      - intent: provide_desired_role
        entities:
          - desired_role: data_scientist
      - action: utter_transition_to_role_questions
      - action: action_route_to_role_interview

  - story: experience then select data engineer
    steps:
      - intent: provide_experience
      - action: utter_confirm_receipt
      - action: action_say_utter_ask_role
      - intent: provide_desired_role
        entities:
          - desired_role: data_engineer
      - action: utter_transition_to_role_questions
      - action: action_route_to_role_interview

  - story: experience then select data analyst
    steps:
      - intent: provide_experience
      - action: utter_confirm_receipt
      - action: action_say_utter_ask_role
      - intent: provide_desired_role
        entities:
          - desired_role: data_analyst
      - action: utter_transition_to_role_questions
      - action: action_route_to_role_interview

  - story: experience then select project manager
    steps:
      - intent: provide_experience
      - action: utter_confirm_receipt
      - action: action_say_utter_ask_role
      - intent: provide_desired_role
        entities:
          - desired_role: project_manager
      - action: utter_transition_to_role_questions
      - action: action_route_to_role_interview

  - story: experience then select mlops engineer
    steps:
      - intent: provide_experience
      - action: utter_confirm_receipt
      - action: action_say_utter_ask_role
      - intent: provide_desired_role
        entities:
          - desired_role: mlops_engineer
      - action: utter_transition_to_role_questions
      - action: action_route_to_role_interview

  # ─── Role → first interview question (teaches TED to wait after routing) ──

  - story: ds - role selected then first answer
    steps:
      - intent: provide_desired_role
        entities:
          - desired_role: data_scientist
      - action: utter_transition_to_role_questions
      - action: action_route_to_role_interview
      - intent: answer_ml_experience
      - action: utter_confirm_receipt
      - action: action_route_to_role_interview

  - story: de - role selected then first answer
    steps:
      - intent: provide_desired_role
        entities:
          - desired_role: data_engineer
      - action: utter_transition_to_role_questions
      - action: action_route_to_role_interview
      - intent: answer_pipeline_experience
      - action: utter_confirm_receipt
      - action: action_route_to_role_interview

  - story: da - role selected then first answer
    steps:
      - intent: provide_desired_role
        entities:
          - desired_role: data_analyst
      - action: utter_transition_to_role_questions
      - action: action_route_to_role_interview
      - intent: answer_business_domain
      - action: utter_confirm_receipt
      - action: action_route_to_role_interview

  - story: pm - role selected then first answer
    steps:
      - intent: provide_desired_role
        entities:
          - desired_role: project_manager
      - action: utter_transition_to_role_questions
      - action: action_route_to_role_interview
      - intent: answer_team_size
      - action: utter_confirm_receipt
      - action: action_route_to_role_interview

  - story: mlops - role selected then first answer
    steps:
      - intent: provide_desired_role
        entities:
          - desired_role: mlops_engineer
      - action: utter_transition_to_role_questions
      - action: action_route_to_role_interview
      - intent: answer_cicd_experience
      - action: utter_confirm_receipt
      - action: action_route_to_role_interview

  - story: ds - role selected then open answer
    steps:
      - intent: provide_desired_role
        entities:
          - desired_role: data_scientist
      - action: utter_transition_to_role_questions
      - action: action_route_to_role_interview
      - intent: answer_interview_open
      - action: utter_confirm_receipt
      - action: action_route_to_role_interview

  # ─── Role selection ───────────────────────────────────────────────────────

  - story: select data scientist
    steps:
      - intent: provide_desired_role
        entities:
          - desired_role: data_scientist
      - action: utter_transition_to_role_questions
      - action: action_route_to_role_interview

  - story: select data engineer
    steps:
      - intent: provide_desired_role
        entities:
          - desired_role: data_engineer
      - action: utter_transition_to_role_questions
      - action: action_route_to_role_interview

  - story: select data analyst
    steps:
      - intent: provide_desired_role
        entities:
          - desired_role: data_analyst
      - action: utter_transition_to_role_questions
      - action: action_route_to_role_interview

  - story: select project manager
    steps:
      - intent: provide_desired_role
        entities:
          - desired_role: project_manager
      - action: utter_transition_to_role_questions
      - action: action_route_to_role_interview

  - story: select mlops engineer
    steps:
      - intent: provide_desired_role
        entities:
          - desired_role: mlops_engineer
      - action: utter_transition_to_role_questions
      - action: action_route_to_role_interview

  # ─── DS interview snippets ────────────────────────────────────────────────

  - story: ds - answer ml experience
    steps:
      - intent: answer_ml_experience
      - action: utter_confirm_receipt
      - action: action_route_to_role_interview

  - story: ds - answer python level
    steps:
      - intent: answer_skill_python
      - action: utter_confirm_receipt
      - action: action_route_to_role_interview

  - story: ds - answer frameworks
    steps:
      - intent: answer_frameworks
      - action: utter_confirm_receipt
      - action: action_route_to_role_interview

  - story: ds - has production experience
    steps:
      - intent: answer_production_experience
      - action: utter_confirm_receipt
      - action: action_route_to_role_interview

  - story: ds - open answer to interview question
    steps:
      - intent: answer_interview_open
      - action: utter_confirm_receipt
      - action: action_route_to_role_interview

  - story: ds - project experience answer
    steps:
      - intent: provide_project_experience
      - action: utter_confirm_receipt
      - action: action_route_to_role_interview

  # ─── DE interview snippets ────────────────────────────────────────────────

  - story: de - answer pipeline experience
    steps:
      - intent: answer_pipeline_experience
      - action: utter_confirm_receipt
      - action: action_route_to_role_interview

  - story: de - answer tools
    steps:
      - intent: answer_tools
      - action: utter_confirm_receipt
      - action: action_route_to_role_interview

  - story: de - answer sql level
    steps:
      - intent: answer_sql_level
      - action: utter_confirm_receipt
      - action: action_route_to_role_interview

  - story: de - answer cloud experience
    steps:
      - intent: answer_cloud_experience
      - action: utter_confirm_receipt
      - action: action_route_to_role_interview

  # ─── DA interview snippets ────────────────────────────────────────────────

  - story: da - answer business domain
    steps:
      - intent: answer_business_domain
      - action: utter_confirm_receipt
      - action: action_route_to_role_interview

  - story: da - answer viz tools
    steps:
      - intent: answer_viz_tools
      - action: utter_confirm_receipt
      - action: action_route_to_role_interview

  # ─── PM interview snippets ────────────────────────────────────────────────

  - story: pm - answer team size
    steps:
      - intent: answer_team_size
      - action: utter_confirm_receipt
      - action: action_route_to_role_interview

  - story: pm - answer methodology
    steps:
      - intent: answer_methodology
      - action: utter_confirm_receipt
      - action: action_route_to_role_interview

  - story: pm - answer ml understanding
    steps:
      - intent: answer_ml_understanding
      - action: utter_confirm_receipt
      - action: action_route_to_role_interview

  # ─── MLOps interview snippets ─────────────────────────────────────────────

  - story: mlops - answer cicd experience
    steps:
      - intent: answer_cicd_experience
      - action: utter_confirm_receipt
      - action: action_route_to_role_interview

  - story: mlops - answer monitoring experience
    steps:
      - intent: answer_monitoring_experience
      - action: utter_confirm_receipt
      - action: action_route_to_role_interview

  # ─── Salary collection ────────────────────────────────────────────────────
  # Эти истории явно показывают TED: после action_route_to_role_interview
  # нужно ЖДАТЬ ввода пользователя, а не предсказывать другое действие.

  - story: salary transition - after ds interview
    steps:
      - intent: answer_interview_open
      - action: utter_confirm_receipt
      - action: action_route_to_role_interview
      - intent: provide_salary
      - action: action_collect_salary

  - story: salary transition - after de interview
    steps:
      - intent: answer_pipeline_experience
      - action: utter_confirm_receipt
      - action: action_route_to_role_interview
      - intent: provide_salary
      - action: action_collect_salary

  - story: salary transition - after da interview
    steps:
      - intent: answer_business_domain
      - action: utter_confirm_receipt
      - action: action_route_to_role_interview
      - intent: provide_salary
      - action: action_collect_salary

  - story: salary transition - after pm interview
    steps:
      - intent: answer_team_size
      - action: utter_confirm_receipt
      - action: action_route_to_role_interview
      - intent: provide_salary
      - action: action_collect_salary

  - story: salary transition - after mlops interview
    steps:
      - intent: answer_cicd_experience
      - action: utter_confirm_receipt
      - action: action_route_to_role_interview
      - intent: provide_salary
      - action: action_collect_salary

  - story: salary transition - answer interview open then salary
    steps:
      - intent: answer_frameworks
      - action: utter_confirm_receipt
      - action: action_route_to_role_interview
      - intent: provide_salary
      - action: action_collect_salary

  - story: salary transition - no experience then salary
    steps:
      - intent: no_experience
      - action: action_route_to_role_interview
      - intent: provide_salary
      - action: action_collect_salary

  - story: candidate provides salary expectation
    steps:
      - intent: provide_salary
      - action: action_collect_salary

  # ─── No experience answers ────────────────────────────────────────────────

  - story: candidate has no experience for current question
    steps:
      - intent: no_experience
      - action: action_route_to_role_interview

  # ─── Error recovery ───────────────────────────────────────────────────────

  - story: unclear answer - clarify then retry with python level
    steps:
      - intent: fallback
      - action: action_handle_unclear_answer
      - intent: answer_skill_python
      - action: utter_confirm_receipt
      - action: action_route_to_role_interview

  - story: unclear answer - clarify then retry with open answer
    steps:
      - intent: fallback
      - action: action_handle_unclear_answer
      - intent: answer_interview_open
      - action: utter_confirm_receipt
      - action: action_route_to_role_interview

  - story: ask repeat then answer open question
    steps:
      - intent: ask_repeat
      - action: action_ask_repeat
      - intent: answer_interview_open
      - action: utter_confirm_receipt
      - action: action_route_to_role_interview

  - story: out of scope then return to interview
    steps:
      - intent: out_of_scope
      - action: action_handle_out_of_scope
      - intent: answer_interview_open
      - action: utter_confirm_receipt
      - action: action_route_to_role_interview

  # ─── Salary waiting (teaches TED that salary stage WAITS for user) ─────────

  - story: salary - user provides salary after ds interview
    steps:
      - intent: answer_interview_open
      - action: utter_confirm_receipt
      - action: action_route_to_role_interview
      - intent: provide_salary
      - action: action_collect_salary

  - story: salary - user provides salary after de interview
    steps:
      - intent: answer_pipeline_experience
      - action: utter_confirm_receipt
      - action: action_route_to_role_interview
      - intent: provide_salary
      - action: action_collect_salary

  - story: salary - user answers open after role interview
    steps:
      - intent: answer_interview_open
      - action: utter_confirm_receipt
      - action: action_route_to_role_interview
      - intent: answer_interview_open
      - action: action_collect_salary

  - story: salary - user provides salary standalone
    steps:
      - intent: provide_salary
      - action: action_collect_salary

  # ─── Post-interview end (teaches TED to wait after farewell) ─────────────

  - story: interview ended - user says goodbye
    steps:
      - intent: goodbye
      - action: utter_goodbye
      - action: action_save_candidate_data

  - story: interview ended - user restarts with greeting
    steps:
      - intent: goodbye
      - action: utter_goodbye
      - action: action_save_candidate_data
      - intent: greet
      - action: action_greet

  - story: interview stopped - user restarts
    steps:
      - intent: stop_interview
      - action: utter_farewell_stopped
      - action: action_save_candidate_data
      - intent: greet
      - action: action_greet

  # ─── Candidate doubts / unsuitable ───────────────────────────────────────

  - story: candidate thinks they are unsuitable
    steps:
      - intent: unsuitable
      - action: action_handle_unsuitable
      - intent: answer_interview_open
      - action: utter_confirm_receipt
      - action: action_route_to_role_interview
