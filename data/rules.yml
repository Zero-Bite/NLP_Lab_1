version: "3.1"

rules:
  - rule: Goodbye at any point
    steps:
      - intent: goodbye
      - action: utter_goodbye
      - action: action_save_candidate_data

  - rule: Stop interview at any point
    steps:
      - intent: stop_interview
      - action: utter_farewell_stopped
      - action: action_save_candidate_data

  - rule: Handle out of scope
    steps:
      - intent: out_of_scope
      - action: action_handle_out_of_scope

  - rule: Default NLU fallback
    steps:
      - intent: nlu_fallback
      - action: action_default_fallback

  - rule: User asks to repeat
    steps:
      - intent: ask_repeat
      - action: action_ask_repeat

  - rule: Confirm readiness in greeting phase
    condition:
      - slot_was_set:
          - interview_stage: greeting
    steps:
      - intent: confirm_readiness
      - action: action_confirm_readiness

  - rule: Provide name in greeting phase
    condition:
      - slot_was_set:
          - interview_stage: greeting
    steps:
      - intent: provide_name
      - action: action_collect_name

  - rule: Candidate doubts selection outcome
    steps:
      - intent: unsuitable
      - action: action_handle_unsuitable

  - rule: Handle unclear answer (fallback intent)
    steps:
      - intent: fallback
      - action: action_handle_unclear_answer

  - rule: Provide experience then ask role
    condition:
      - slot_was_set:
          - interview_stage: collect_experience
    steps:
      - intent: provide_experience
      - action: utter_confirm_receipt
      - action: action_say_utter_ask_role
    wait_for_user_input: true

  - rule: After low experience warning continue to role
    condition:
      - slot_was_set:
          - interview_stage: collect_experience_low
    steps:
      - intent: provide_experience
      - action: utter_confirm_receipt
      - action: action_say_utter_ask_role
    wait_for_user_input: true

  - rule: Low experience follow-up affirm
    condition:
      - slot_was_set:
          - interview_stage: collect_experience_low
    steps:
      - intent: affirm
      - action: utter_confirm_receipt
      - action: action_say_utter_ask_role
    wait_for_user_input: true

  - rule: Low experience follow-up open answer
    condition:
      - slot_was_set:
          - interview_stage: collect_experience_low
    steps:
      - intent: answer_interview_open
      - action: utter_confirm_receipt
      - action: action_say_utter_ask_role
    wait_for_user_input: true

  - rule: Provide role then transition
    condition:
      - slot_was_set:
          - interview_stage: collect_role
    steps:
      - intent: provide_desired_role
      - action: utter_transition_to_role_questions
      - action: action_route_to_role_interview
    wait_for_user_input: true

  - rule: Route role interview answer
    condition:
      - slot_was_set:
          - interview_stage: interview_ds
    steps:
      - intent: answer_ml_experience
      - action: utter_confirm_receipt
      - action: action_route_to_role_interview

  - rule: DS interview project or ML experience
    condition:
      - slot_was_set:
          - interview_stage: interview_ds
    steps:
      - intent: provide_project_experience
      - action: utter_confirm_receipt
      - action: action_route_to_role_interview

  - rule: DS interview open text answers
    condition:
      - slot_was_set:
          - interview_stage: interview_ds
    steps:
      - intent: answer_interview_open
      - action: utter_confirm_receipt
      - action: action_route_to_role_interview

  - rule: DS interview frameworks
    condition:
      - slot_was_set:
          - interview_stage: interview_ds
