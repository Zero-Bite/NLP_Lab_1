  - rule: Collect salary - affirm
    condition:
      - slot_was_set:
          - interview_stage: collect_salary
    steps:
      - intent: affirm
      - action: action_collect_salary

  - rule: Collect salary - provide skills
    condition:
      - slot_was_set:
          - interview_stage: collect_salary
    steps:
      - intent: provide_skills
      - action: action_collect_salary

  - rule: Any answer in DA interview routes to role interview
    condition:
      - slot_was_set:
          - interview_stage: interview_da
    steps:
      - intent: affirm
      - action: utter_confirm_receipt
      - action: action_route_to_role_interview

  - rule: Generic answer in DA interview
    condition:
      - slot_was_set:
          - interview_stage: interview_da
    steps:
      - intent: no_experience
      - action: action_route_to_role_interview