version: "3.1"

# ═══════════════════════════════════════════════════════════════════════════════
# ПОЗИТИВНЫЕ СЦЕНАРИИ — полный путь по каждой роли
# ═══════════════════════════════════════════════════════════════════════════════

stories:

  # ─── Data Scientist — полный позитивный путь ──────────────────────────────

  - story: [DS] positive - greeting and name
    steps:
      - user: "Привет"
        intent: greet
      - action: action_greet
      - user: "Петров Алексей Сергеевич"
        intent: provide_name
      - action: action_collect_name

  - story: [DS] positive - experience and role selection
    steps:
      - user: "У меня 4 года опыта в ML"
        intent: provide_experience
      - action: utter_confirm_receipt
      - action: action_say_utter_ask_role
      - user: "Хочу позицию data_scientist"
        intent: provide_desired_role
      - action: utter_transition_to_role_questions
      - action: action_route_to_role_interview

  - story: [DS] positive - ml experience answer
    steps:
      - user: "Строил модели классификации оттока и прогноза LTV в sklearn и CatBoost"
        intent: answer_ml_experience
      - action: utter_confirm_receipt
      - action: action_route_to_role_interview

  - story: [DS] positive - task types
    steps:
      - user: "Классификация, регрессия, немного NLP для саппорт-тикетов"
        intent: answer_interview_open
      - action: utter_confirm_receipt
      - action: action_route_to_role_interview

  - story: [DS] positive - feature engineering
    steps:
      - user: "Да, создавал лаговые признаки и rolling-агрегаты для временных рядов"
        intent: answer_interview_open
      - action: utter_confirm_receipt
      - action: action_route_to_role_interview

  - story: [DS] positive - validation metrics
    steps:
      - user: "ROC-AUC и F1 для классификации, MAE и RMSE для регрессии, кросс-валидация"
        intent: answer_interview_open
      - action: utter_confirm_receipt
      - action: action_route_to_role_interview

  - story: [DS] positive - python level
    steps:
      - user: "Продвинутый уровень Python"
        intent: answer_skill_python
      - action: utter_confirm_receipt
      - action: action_route_to_role_interview

  - story: [DS] positive - frameworks
    steps:
      - user: "sklearn, CatBoost, PyTorch, pandas, numpy"
        intent: answer_frameworks
      - action: utter_confirm_receipt
      - action: action_route_to_role_interview

  - story: [DS] positive - production experience
    steps:
      - user: "Да, выкатывали модели через Docker и REST API на FastAPI"
        intent: answer_production_experience
      - action: utter_confirm_receipt
      - action: action_route_to_role_interview

  - story: [DS] positive - ab testing
    steps:
      - user: "Да, проводил A/B тесты с bootstrap и t-test, считал sample size заранее"
        intent: answer_interview_open
      - action: utter_confirm_receipt
      - action: action_route_to_role_interview

  - story: [DS] positive - llm experience
    steps:
      - user: "Работал с OpenAI API и делал RAG-систему для внутренней базы знаний"
        intent: answer_interview_open
      - action: utter_confirm_receipt
      - action: action_route_to_role_interview

  - story: [DS] positive - inference optimization
    steps:
      - user: "Квантизация INT8, батчинг запросов, кэширование эмбеддингов"
        intent: answer_interview_open
      - action: utter_confirm_receipt
      - action: action_route_to_role_interview

  - story: [DS] positive - salary
    steps:
      - user: "Ожидаю 250000 рублей в месяц"
        intent: provide_salary
      - action: action_collect_salary

