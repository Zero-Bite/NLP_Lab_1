# ═══════════════════════════════════════════════════════════════════════════════
# НЕГАТИВНЫЕ И ПОГРАНИЧНЫЕ СЦЕНАРИИ
# ═══════════════════════════════════════════════════════════════════════════════

  # ─── Остановка интервью ───────────────────────────────────────────────────

  - story: [NEG] stop interview on experience phase
    steps:
      - user: "Хочу остановиться"
        intent: stop_interview
      - action: utter_farewell_stopped
      - action: action_save_candidate_data

  - story: [NEG] stop interview during DS questions
    steps:
      - user: "Прекратим собеседование"
        intent: stop_interview
      - action: utter_farewell_stopped
      - action: action_save_candidate_data

  - story: [NEG] goodbye after salary question
    steps:
      - user: "До свидания"
        intent: goodbye
      - action: utter_goodbye
      - action: action_save_candidate_data

  # ─── Малый опыт ───────────────────────────────────────────────────────────

  - story: [NEG] low experience - affirm and continue
    steps:
      - user: "Опыт 3 месяца, был учебный проект"
        intent: provide_experience
      - action: utter_confirm_receipt
      - action: action_say_utter_low_experience_warning
      - user: "Да, делал pet-project на Kaggle"
        intent: affirm
      - action: utter_confirm_receipt
      - action: action_say_utter_ask_role

  - story: [NEG] low experience - open answer and continue
    steps:
      - user: "Полгода стажировки"
        intent: provide_experience
      - action: utter_confirm_receipt
      - action: action_say_utter_low_experience_warning
      - user: "Стажировался в Сбере, работал с данными"
        intent: answer_interview_open
      - action: utter_confirm_receipt
      - action: action_say_utter_ask_role

  # ─── Восстановление после ошибок ─────────────────────────────────────────

  - story: [ERR] unclear answer - then retry
    steps:
      - user: "Не понял вопрос"
        intent: fallback
      - action: action_handle_unclear_answer
      - user: "продвинутый"
        intent: answer_skill_python
      - action: utter_confirm_receipt
      - action: action_route_to_role_interview

  - story: [ERR] ask repeat - then answer
    steps:
      - user: "Повторите, пожалуйста"
        intent: ask_repeat
      - action: action_ask_repeat
      - user: "sklearn, PyTorch, CatBoost"
        intent: answer_frameworks
      - action: utter_confirm_receipt
      - action: action_route_to_role_interview

  - story: [ERR] out of scope - then return to interview
    steps:
      - user: "Сколько стоит iPhone?"
        intent: out_of_scope
      - action: action_handle_out_of_scope
      - user: "Делал feature engineering: лаговые фичи и таргет-энкодинг"
        intent: answer_interview_open
      - action: utter_confirm_receipt
      - action: action_route_to_role_interview

  - story: [ERR] no experience answer
    steps:
      - user: "Нет, с этим не работал"
        intent: no_experience
      - action: action_route_to_role_interview

  # ─── Кандидат сомневается ─────────────────────────────────────────────────

  - story: [ERR] candidate thinks unsuitable then continues
    steps:
      - user: "Кажется, я не подхожу на эту роль"
        intent: unsuitable
      - action: action_handle_unsuitable
      - user: "Работал с Airflow и dbt"
        intent: answer_interview_open
      - action: utter_confirm_receipt
      - action: action_route_to_role_interview

  # ─── Перезапуск после завершения ──────────────────────────────────────────

  - story: [EDGE] greet again after farewell
    steps:
      - user: "Привет"
        intent: greet
      - action: action_greet

  # ─── Подтверждение готовности перед именем ────────────────────────────────

  - story: [EDGE] confirm readiness before name
    steps:
      - user: "Привет"
        intent: greet
      - action: action_greet
      - user: "Да, готов к интервью"
        intent: confirm_readiness
      - action: action_confirm_readiness
      - user: "Сидоров Дмитрий Иванович"
        intent: provide_name
      - action: action_collect_name
